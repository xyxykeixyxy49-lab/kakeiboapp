name: 表記チェック（NGワード・登録商標）

on:
  push:
    paths: ["senryaku-mg-hp/**"]
  pull_request:
    paths: ["senryaku-mg-hp/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 senryaku-mg-hp/tools/check_terms.py
